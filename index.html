<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>比價小幫手</title>
<style>
:root {
  --accent:#8B5CF6; --accent-light:#EDE9FE; --accent-btn:#7C3AED;
  --winner-bg:#F0FDF4; --winner-border:#22C55E; --winner-text:#16A34A;
  --bg:#F3EEFE; --card:#FFFFFF; --text:#1C1C1E; --text-soft:#8E8E93;
  --border:#E5E5EA; --danger:#FF3B30; --save-bg:#8B5CF6; --tab-active:#8B5CF6;
  --radius:16px; --shadow:0 2px 14px rgba(0,0,0,0.08);
}
.theme-blue  { --accent:#3B82F6; --accent-light:#EFF6FF; --accent-btn:#2563EB; --tab-active:#3B82F6; --bg:#E8F0FE; --save-bg:#3B82F6; }
.theme-green { --accent:#22C55E; --accent-light:#F0FDF4; --accent-btn:#16A34A; --tab-active:#22C55E; --bg:#ECFDF5; --save-bg:#22C55E; }
.theme-orange{ --accent:#F97316; --accent-light:#FFF7ED; --accent-btn:#EA580C; --tab-active:#F97316; --bg:#FEF3E8; --save-bg:#F97316; }

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;color:var(--text);min-height:100vh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative;}

/* TOP BAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;background:var(--bg);position:sticky;top:0;z-index:50;}
.topbar h1{font-size:18px;font-weight:700;}
.topbar-btns{display:flex;gap:8px;}
.pill-btn{display:flex;align-items:center;gap:5px;padding:7px 14px;border-radius:30px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s;background:var(--accent);color:#fff;}
.pill-btn:active{opacity:.75;}

/* PAGES */
.page{display:none;flex-direction:column;flex:1;padding:0 12px 110px;overflow-y:auto;}
.page.active{display:flex;}

/* ════════════════════
   BASIC COMPARE PAGE
   ════════════════════ */
.basic-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4px;}
.basic-card{background:var(--card);border-radius:var(--radius);padding:18px 14px;box-shadow:var(--shadow);border:2.5px solid transparent;transition:border-color .25s,background .25s;}
.basic-card.winner{border-color:var(--winner-border);background:var(--winner-bg);}
.basic-card.loser .basic-up{text-decoration:line-through;opacity:.5;color:var(--danger)!important;}
.basic-card-label{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-soft);margin-bottom:12px;}
.basic-card.winner .basic-card-label{color:var(--winner-text);}
.basic-field{margin-bottom:10px;}
.basic-field label{display:block;font-size:10px;color:var(--text-soft);margin-bottom:4px;font-weight:500;}
.basic-field input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:10px 10px;font-size:17px;color:var(--text);background:#F9F9FB;outline:none;transition:border-color .2s;-webkit-appearance:none;}
.basic-field input:focus{border-color:var(--accent);background:#fff;}
.basic-field input::placeholder{color:#C7C7CC;font-size:14px;}
.basic-up-wrap{margin-top:14px;text-align:center;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.basic-best{font-size:9px;font-weight:700;color:var(--winner-text);letter-spacing:.8px;text-transform:uppercase;margin-bottom:2px;}
.basic-up{font-size:22px;font-weight:800;color:var(--text-soft);font-variant-numeric:tabular-nums;transition:color .3s;}
.basic-card.winner .basic-up{color:var(--winner-text);}
.basic-up-sub{font-size:10px;color:var(--text-soft);margin-top:2px;}
.basic-result{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);margin-top:14px;text-align:center;min-height:50px;display:flex;align-items:center;justify-content:center;}
.basic-result p{font-size:14px;color:var(--text-soft);line-height:1.6;}
.basic-result p strong{color:var(--accent);font-weight:700;}
.basic-reset{margin-top:12px;width:100%;padding:12px;background:none;border:1.5px solid var(--border);border-radius:30px;color:var(--text-soft);font-size:14px;font-weight:600;cursor:pointer;}
.basic-reset:active{background:var(--border);}
.basic-tip{margin-top:14px;font-size:11.5px;color:var(--text-soft);text-align:center;line-height:1.7;padding-bottom:4px;}

/* ════════════════════
   BEST VALUE PAGE
   ════════════════════ */
.products-single{display:flex;flex-direction:column;gap:12px;}
.products-double{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.product-card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);border:2px solid transparent;transition:border-color .25s,background .25s;}
.product-card.winner{border-color:var(--winner-border);background:var(--winner-bg);}
.products-double .product-card{padding:12px 10px;}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.card-title{font-size:15px;font-weight:700;color:var(--accent);}
.product-card.winner .card-title{color:var(--winner-text);}
.products-double .card-title{font-size:13px;}
.card-actions{display:flex;align-items:center;gap:6px;}
.icon-btn{background:none;border:none;cursor:pointer;padding:2px;font-size:16px;line-height:1;}
.field-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.field-icon{font-size:16px;flex-shrink:0;}
.field-col{flex:1;}
.field-label{font-size:10px;color:var(--text-soft);margin-bottom:2px;font-weight:500;}
.field-input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:8px 10px;font-size:15px;color:var(--text);background:#F9F9FB;outline:none;cursor:pointer;transition:border-color .2s;min-height:38px;}
.field-input.active-field{border-color:var(--accent);background:#fff;}
.products-double .field-input{font-size:13px;padding:7px 8px;}
.unit-result{margin-top:10px;text-align:center;}
.unit-price-value{font-size:24px;font-weight:800;color:var(--text-soft);transition:color .3s;}
.product-card.winner .unit-price-value{color:var(--winner-text);}
.unit-price-label{font-size:10px;color:var(--text-soft);margin-top:2px;}
.best-badge{font-size:10px;font-weight:700;color:var(--winner-text);letter-spacing:.5px;margin-bottom:2px;}
.products-double .unit-price-value{font-size:18px;}
.save-btn{display:flex;align-items:center;gap:4px;padding:5px 10px;border-radius:20px;border:none;background:var(--save-bg);color:#fff;font-size:11px;font-weight:600;cursor:pointer;}
.add-card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;border:2px dashed var(--border);transition:border-color .2s;}
.add-card:active{border-color:var(--accent);}
.add-circle{width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;}
.add-label{font-size:13px;color:var(--accent);font-weight:600;}
.products-double .add-card{padding:14px;}
.products-double .add-circle{width:36px;height:36px;font-size:20px;}

/* KEYBOARD */
.keyboard-overlay{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#D1D5DB;border-top:1px solid #BDC1C8;z-index:200;display:none;}
.keyboard-overlay.visible{display:block;}
.kb-hint{display:flex;align-items:center;justify-content:space-between;padding:6px 16px;background:#E5E7EB;}
.kb-hint-arrows{display:flex;gap:12px;}
.kb-arrow{background:none;border:none;font-size:18px;cursor:pointer;color:var(--text-soft);}
.kb-hint-label{font-size:12px;color:var(--text-soft);}
.kb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#BDC1C8;}
.kb-key{background:#fff;padding:16px 0;font-size:20px;font-weight:400;text-align:center;cursor:pointer;border:none;transition:background .1s;color:var(--text);}
.kb-key:active{background:#C8C8CC;}
.kb-key.clear{color:var(--danger);font-size:16px;font-weight:600;}
.kb-done{width:100%;padding:16px;background:var(--accent-btn);color:#fff;font-size:17px;font-weight:600;border:none;cursor:pointer;}
.kb-done:active{opacity:.85;}

/* SAVED */
.saved-list{display:flex;flex-direction:column;gap:10px;padding-top:4px;}
.saved-item{background:var(--card);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;}
.saved-name{font-size:14px;font-weight:600;}
.saved-detail{font-size:12px;color:var(--text-soft);margin-top:2px;}
.saved-price{font-size:18px;font-weight:700;color:var(--accent);}
.saved-empty{text-align:center;color:var(--text-soft);font-size:14px;padding-top:60px;line-height:2;}
.saved-restore-btn{font-size:12px;background:var(--accent-light);color:var(--accent);border:none;border-radius:20px;padding:5px 12px;cursor:pointer;font-weight:600;}

/* SETTINGS */
.settings-section{margin-top:12px;}
.settings-label{font-size:11px;font-weight:600;letter-spacing:1px;color:var(--text-soft);text-transform:uppercase;margin-bottom:8px;padding-left:4px;}
.theme-row{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);display:flex;gap:8px;overflow-x:auto;}
.theme-swatch{flex:1;min-width:64px;border-radius:12px;border:2px solid transparent;padding:10px 6px;text-align:center;cursor:pointer;transition:border-color .2s;}
.theme-swatch.active{border-color:currentColor;}
.swatch-circle{width:32px;height:32px;border-radius:50%;margin:0 auto 6px;display:flex;align-items:center;justify-content:center;font-size:14px;}
.swatch-name{font-size:11px;font-weight:600;}
.currency-row{background:var(--card);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);display:flex;justify-content:space-between;align-items:center;margin-top:10px;}
.currency-label{font-size:15px;}
.currency-select{border:none;background:none;color:var(--accent);font-size:15px;font-weight:600;cursor:pointer;outline:none;}

/* TAB BAR */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 0 8px;cursor:pointer;color:var(--text-soft);transition:color .2s;border:none;background:none;}
.tab.active{color:var(--tab-active);}
.tab-icon{font-size:20px;margin-bottom:2px;}
.tab-label{font-size:10px;font-weight:500;}

/* TOAST */
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-10px);background:#1C1C1E;color:#fff;font-size:13px;padding:10px 20px;border-radius:30px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.page-pad{padding-top:8px;}
</style>
</head>
<body>

<div class="topbar">
  <h1 id="pageTitle">比價</h1>
  <div class="topbar-btns" id="topActions">
    <!-- filled by JS -->
  </div>
</div>

<!-- ══ PAGE: BASIC COMPARE ══ -->
<div class="page active page-pad" id="page-basic">
  <div class="basic-grid">
    <!-- Card A -->
    <div class="basic-card" id="bCardA">
      <div class="basic-card-label">商品 A</div>
      <div class="basic-field">
        <label>售價</label>
        <input type="number" id="bPriceA" inputmode="decimal" placeholder="0.00" min="0" step="any" oninput="basicUpdate()">
      </div>
      <div class="basic-field">
        <label>數量／容量</label>
        <input type="number" id="bQtyA" inputmode="decimal" placeholder="0" min="0" step="any" oninput="basicUpdate()">
      </div>
      <div class="basic-up-wrap">
        <div class="basic-best" id="bBestA"></div>
        <div class="basic-up" id="bUpA">—</div>
        <div class="basic-up-sub" id="bSubA"></div>
      </div>
    </div>
    <!-- Card B -->
    <div class="basic-card" id="bCardB">
      <div class="basic-card-label">商品 B</div>
      <div class="basic-field">
        <label>售價</label>
        <input type="number" id="bPriceB" inputmode="decimal" placeholder="0.00" min="0" step="any" oninput="basicUpdate()">
      </div>
      <div class="basic-field">
        <label>數量／容量</label>
        <input type="number" id="bQtyB" inputmode="decimal" placeholder="0" min="0" step="any" oninput="basicUpdate()">
      </div>
      <div class="basic-up-wrap">
        <div class="basic-best" id="bBestB"></div>
        <div class="basic-up" id="bUpB">—</div>
        <div class="basic-up-sub" id="bSubB"></div>
      </div>
    </div>
  </div>
  <div class="basic-result" id="bResult">
    <p>輸入兩個商品的售價與數量，開始比價 👆</p>
  </div>
  <button class="basic-reset" onclick="basicReset()">↺ 重新輸入</button>
  <p class="basic-tip">超過兩個商品？先比出划算的，<br>再切換到「進階比價」新增更多商品！</p>
</div>

<!-- ══ PAGE: BEST VALUE ══ -->
<div class="page page-pad" id="page-advanced">
  <div id="productsContainer" class="products-single"></div>
</div>

<!-- ══ PAGE: SAVED ══ -->
<div class="page page-pad" id="page-saved">
  <div class="saved-list" id="savedList"></div>
</div>

<!-- ══ PAGE: SETTINGS ══ -->
<div class="page page-pad" id="page-settings">
  <div class="settings-section">
    <div class="settings-label">應用程式主題</div>
    <div class="theme-row">
      <div class="theme-swatch active" style="color:#8B5CF6" onclick="setTheme('',this)">
        <div class="swatch-circle" style="background:#EDE9FE">✓</div>
        <div class="swatch-name">紫色</div>
      </div>
      <div class="theme-swatch" style="color:#3B82F6" onclick="setTheme('theme-blue',this)">
        <div class="swatch-circle" style="background:#EFF6FF;color:#3B82F6">✓</div>
        <div class="swatch-name">藍色</div>
      </div>
      <div class="theme-swatch" style="color:#22C55E" onclick="setTheme('theme-green',this)">
        <div class="swatch-circle" style="background:#F0FDF4;color:#22C55E">✓</div>
        <div class="swatch-name">綠色</div>
      </div>
      <div class="theme-swatch" style="color:#F97316" onclick="setTheme('theme-orange',this)">
        <div class="swatch-circle" style="background:#FFF7ED;color:#F97316">✓</div>
        <div class="swatch-name">橘色</div>
      </div>
    </div>
    <div class="currency-row">
      <div class="currency-label">貨幣符號</div>
      <select class="currency-select" id="currencySelect" onchange="setCurrency(this.value)">
        <option value="NT$">NT$ 台幣</option>
        <option value="$">$ 美元</option>
        <option value="¥">¥ 日圓</option>
        <option value="€">€ 歐元</option>
        <option value="£">£ 英鎊</option>
        <option value="HK$">HK$ 港幣</option>
      </select>
    </div>
  </div>
</div>

<!-- ══ KEYBOARD (advanced only) ══ -->
<div class="keyboard-overlay" id="keyboard">
  <div class="kb-hint">
    <div class="kb-hint-arrows">
      <button class="kb-arrow" onclick="focusPrev()">▲</button>
      <button class="kb-arrow" onclick="focusNext()">▼</button>
    </div>
    <div class="kb-hint-label" id="kbHintLabel"></div>
  </div>
  <div class="kb-grid">
    <button class="kb-key" onclick="kbInput('1')">1</button>
    <button class="kb-key" onclick="kbInput('2')">2</button>
    <button class="kb-key" onclick="kbInput('3')">3</button>
    <button class="kb-key" onclick="kbInput('4')">4</button>
    <button class="kb-key" onclick="kbInput('5')">5</button>
    <button class="kb-key" onclick="kbInput('6')">6</button>
    <button class="kb-key" onclick="kbInput('7')">7</button>
    <button class="kb-key" onclick="kbInput('8')">8</button>
    <button class="kb-key" onclick="kbInput('9')">9</button>
    <button class="kb-key clear" onclick="kbClear()">清除</button>
    <button class="kb-key" onclick="kbInput('0')">0</button>
    <button class="kb-key" onclick="kbBackspace()">⌫</button>
  </div>
  <button class="kb-done" onclick="kbDone()">完成</button>
</div>

<!-- ══ TAB BAR ══ -->
<div class="tabbar">
  <button class="tab active" id="tab-basic" onclick="switchTab('basic')">
    <div class="tab-icon">🏷️</div>
    <div class="tab-label">比價</div>
  </button>
  <button class="tab" id="tab-advanced" onclick="switchTab('advanced')">
    <div class="tab-icon">⚡</div>
    <div class="tab-label">進階比價</div>
  </button>
  <button class="tab" id="tab-saved" onclick="switchTab('saved')">
    <div class="tab-icon">🔖</div>
    <div class="tab-label">已儲存</div>
  </button>
  <button class="tab" id="tab-settings" onclick="switchTab('settings')">
    <div class="tab-icon">⚙️</div>
    <div class="tab-label">設定</div>
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
// ── SHARED STATE ──
let currency = 'NT$';

// ══════════════════════════════
// BASIC COMPARE
// ══════════════════════════════
function basicUpdate() {
  const prA = parseFloat(document.getElementById('bPriceA').value);
  const qA  = parseFloat(document.getElementById('bQtyA').value);
  const prB = parseFloat(document.getElementById('bPriceB').value);
  const qB  = parseFloat(document.getElementById('bQtyB').value);
  const upA = (prA > 0 && qA > 0) ? prA / qA : null;
  const upB = (prB > 0 && qB > 0) ? prB / qB : null;

  document.getElementById('bUpA').textContent = upA !== null ? fmtPrice(upA) : '—';
  document.getElementById('bUpB').textContent = upB !== null ? fmtPrice(upB) : '—';
  document.getElementById('bSubA').textContent = upA !== null ? `每單位 · ${currency}${prA}/${qA}` : '';
  document.getElementById('bSubB').textContent = upB !== null ? `每單位 · ${currency}${prB}/${qB}` : '';

  const cA = document.getElementById('bCardA');
  const cB = document.getElementById('bCardB');
  cA.classList.remove('winner','loser');
  cB.classList.remove('winner','loser');
  document.getElementById('bBestA').textContent = '';
  document.getElementById('bBestB').textContent = '';

  if (upA !== null && upB !== null) {
    if (upA < upB) {
      cA.classList.add('winner'); cB.classList.add('loser');
      document.getElementById('bBestA').textContent = '🏆 最划算';
      const pct = (((upB-upA)/upB)*100).toFixed(1);
      document.getElementById('bResult').innerHTML = `<p>💚 <strong>商品 A 較划算</strong>，便宜 ${pct}%</p>`;
    } else if (upB < upA) {
      cB.classList.add('winner'); cA.classList.add('loser');
      document.getElementById('bBestB').textContent = '🏆 最划算';
      const pct = (((upA-upB)/upA)*100).toFixed(1);
      document.getElementById('bResult').innerHTML = `<p>💚 <strong>商品 B 較划算</strong>，便宜 ${pct}%</p>`;
    } else {
      document.getElementById('bResult').innerHTML = `<p>兩個商品單價相同，選喜歡的吧 😄</p>`;
    }
  } else if (upA !== null || upB !== null) {
    document.getElementById('bResult').innerHTML = `<p>繼續輸入另一個商品的資料 👆</p>`;
  } else {
    document.getElementById('bResult').innerHTML = `<p>輸入兩個商品的售價與數量，開始比價 👆</p>`;
  }
}

function basicReset() {
  ['bPriceA','bQtyA','bPriceB','bQtyB'].forEach(id => document.getElementById(id).value = '');
  ['bUpA','bUpB'].forEach(id => document.getElementById(id).textContent = '—');
  ['bSubA','bSubB','bBestA','bBestB'].forEach(id => document.getElementById(id).textContent = '');
  document.getElementById('bCardA').classList.remove('winner','loser');
  document.getElementById('bCardB').classList.remove('winner','loser');
  document.getElementById('bResult').innerHTML = `<p>輸入兩個商品的售價與數量，開始比價 👆</p>`;
}

// ══════════════════════════════
// ADVANCED / BEST VALUE
// ══════════════════════════════
let products = [], nextId = 1, activeFieldInfo = null, displayMode = 'single';

function advInit() { products=[]; nextId=1; addProduct(); addProduct(); advRender(); }
function addProduct() { products.push({id:nextId++, price:'', qty:''}); }

function advRender() {
  const c = document.getElementById('productsContainer');
  c.className = displayMode === 'double' ? 'products-double' : 'products-single';
  const ups = products.map(p => {
    const pr=parseFloat(p.price), q=parseFloat(p.qty);
    return (pr>0&&q>0) ? pr/q : null;
  });
  const valid = ups.filter(v=>v!==null);
  const minUp = valid.length>=2 ? Math.min(...valid) : null;

  let html = '';
  products.forEach((p,i) => {
    const up = ups[i];
    const isW = up!==null && up===minUp && valid.length>=2;
    const apF = activeFieldInfo?.productId===p.id && activeFieldInfo?.field==='price';
    const apQ = activeFieldInfo?.productId===p.id && activeFieldInfo?.field==='qty';
    html += `<div class="product-card ${isW?'winner':''}" id="card-${p.id}">
      <div class="card-header">
        <div class="card-title">商品 ${i+1}</div>
        <div class="card-actions">
          ${isW?'<span>✅</span>':''}
          <button class="icon-btn" onclick="deleteProduct(${p.id})">🗑️</button>
        </div>
      </div>
      <div class="field-row"><div class="field-icon">💰</div>
        <div class="field-col">
          <div class="field-label">售價（${currency}）</div>
          <div class="field-input ${apF?'active-field':''}" onclick="openKb(${p.id},'price')">${p.price||'<span style="color:#C7C7CC">0.00</span>'}</div>
        </div>
      </div>
      <div class="field-row"><div class="field-icon">⚖️</div>
        <div class="field-col">
          <div class="field-label">數量／容量</div>
          <div class="field-input ${apQ?'active-field':''}" onclick="openKb(${p.id},'qty')">${p.qty||'<span style="color:#C7C7CC">0</span>'}</div>
        </div>
      </div>
      <div class="unit-result">
        ${isW?'<div class="best-badge">🏆 最划算</div>':''}
        <div class="unit-price-value">${up!==null?fmtPrice(up):'—'}</div>
        ${up!==null?`<div class="unit-price-label">每單位 · ${currency}${p.price}/${p.qty}</div>`:''}
      </div>
      <div style="text-align:right;margin-top:10px;">
        <button class="save-btn" onclick="saveProduct(${p.id})">💾 儲存</button>
      </div>
    </div>`;
  });
  html += `<div class="add-card" onclick="addProdAndRender()">
    <div class="add-circle">+</div><div class="add-label">新增商品</div>
  </div>`;
  c.innerHTML = html;
}

function addProdAndRender() { addProduct(); advRender(); }
function deleteProduct(id) {
  if(products.length<=1){showToast('至少需要一個商品');return;}
  products=products.filter(p=>p.id!==id);
  if(activeFieldInfo?.productId===id){activeFieldInfo=null;hideKb();}
  advRender();
}
function resetAll() { advInit(); activeFieldInfo=null; hideKb(); showToast('已全部重設'); }
function toggleDisplay() {
  displayMode = displayMode==='single'?'double':'single';
  document.getElementById('advDisplayLabel').textContent = displayMode==='double'?'單欄':'雙欄';
  advRender();
}

// KB
function openKb(pid, field) {
  activeFieldInfo={productId:pid,field};
  const p=products.find(x=>x.id===pid), i=products.indexOf(p);
  document.getElementById('kbHintLabel').textContent=`正在編輯：商品 ${i+1} 的${field==='price'?'售價':'數量'}`;
  document.getElementById('keyboard').classList.add('visible');
  advRender();
  setTimeout(()=>{const el=document.getElementById('card-'+pid);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},50);
}
function hideKb(){document.getElementById('keyboard').classList.remove('visible');activeFieldInfo=null;advRender();}
function kbInput(v){
  if(!activeFieldInfo)return;
  const p=products.find(x=>x.id===activeFieldInfo.productId);
  if(!p)return;
  if(v==='.'&&p[activeFieldInfo.field].includes('.'))return;
  p[activeFieldInfo.field]+=v; advRender();
  const i=products.indexOf(p);
  document.getElementById('kbHintLabel').textContent=`正在編輯：商品 ${i+1} 的${activeFieldInfo.field==='price'?'售價':'數量'}`;
}
function kbBackspace(){if(!activeFieldInfo)return;const p=products.find(x=>x.id===activeFieldInfo.productId);if(!p)return;p[activeFieldInfo.field]=p[activeFieldInfo.field].slice(0,-1);advRender();}
function kbClear(){if(!activeFieldInfo)return;const p=products.find(x=>x.id===activeFieldInfo.productId);if(!p)return;p[activeFieldInfo.field]='';advRender();}
function kbDone(){hideKb();}
function focusPrev(){
  if(!activeFieldInfo)return;
  const fs=[];products.forEach(p=>{fs.push({id:p.id,f:'price'});fs.push({id:p.id,f:'qty'});});
  const cur=fs.findIndex(x=>x.id===activeFieldInfo.productId&&x.f===activeFieldInfo.field);
  if(cur>0){const prev=fs[cur-1];openKb(prev.id,prev.f);}
}
function focusNext(){
  if(!activeFieldInfo)return;
  const fs=[];products.forEach(p=>{fs.push({id:p.id,f:'price'});fs.push({id:p.id,f:'qty'});});
  const cur=fs.findIndex(x=>x.id===activeFieldInfo.productId&&x.f===activeFieldInfo.field);
  if(cur<fs.length-1){const next=fs[cur+1];openKb(next.id,next.f);}
}

// SAVE
let savedItems=[];
function saveProduct(id){
  const p=products.find(x=>x.id===id);
  const pr=parseFloat(p.price),q=parseFloat(p.qty);
  if(!pr||!q){showToast('請先輸入售價和數量');return;}
  const i=products.indexOf(p);
  savedItems.push({id:Date.now(),name:`商品 ${i+1}`,price:p.price,qty:p.qty,unitPrice:pr/q,savedAt:new Date().toLocaleString('zh-TW')});
  showToast(`已儲存！每單位 ${fmtPrice(pr/q)}`);
  renderSaved();
}
function renderSaved(){
  const list=document.getElementById('savedList');
  if(savedItems.length===0){list.innerHTML='<div class="saved-empty">📭 還沒有儲存的商品<br><br>在比價頁面點「儲存」就會出現在這裡</div>';return;}
  list.innerHTML=[...savedItems].reverse().map(item=>`
    <div class="saved-item">
      <div><div class="saved-name">${item.name}</div><div class="saved-detail">${currency}${item.price} / ${item.qty} · ${item.savedAt}</div></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
        <div class="saved-price">${fmtPrice(item.unitPrice)}</div>
        <button class="saved-restore-btn" onclick="restoreProduct(${item.id})">帶入比價</button>
      </div>
    </div>`).join('');
}
function restoreProduct(savedId){
  const item=savedItems.find(x=>x.id===savedId);if(!item)return;
  addProduct();const p=products[products.length-1];p.price=item.price;p.qty=item.qty;
  advRender();switchTab('advanced');showToast('已帶入進階比價！');
}

// SETTINGS
function setTheme(theme,el){
  document.body.classList.remove('theme-blue','theme-green','theme-orange');
  if(theme)document.body.classList.add(theme);
  document.querySelectorAll('.theme-swatch').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
}
function setCurrency(val){currency=val;basicUpdate();advRender();}

// TABS
const pageTitles={basic:'比價',advanced:'進階比價',saved:'已儲存',settings:'設定'};
function switchTab(tab){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('page-'+tab).classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
  document.getElementById('pageTitle').textContent=pageTitles[tab];

  // update top action buttons
  const actions=document.getElementById('topActions');
  if(tab==='advanced'){
    actions.innerHTML=`
      <button class="pill-btn" onclick="resetAll()">↺ 重設</button>
      <button class="pill-btn" onclick="toggleDisplay()">⊞ <span id="advDisplayLabel">${displayMode==='double'?'單欄':'雙欄'}</span></button>`;
  } else {
    actions.innerHTML='';
  }

  if(tab==='saved')renderSaved();
  if(tab!=='advanced')hideKb();
}

// UTIL
function fmtPrice(val){
  if(val===null||val===undefined)return'—';
  if(val>=10)return currency+val.toFixed(2);
  if(val>=1) return currency+val.toFixed(3);
  return currency+parseFloat(val.toPrecision(4)).toString();
}
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// INIT
advInit();
renderSaved();
</script>
</body>
</html>
